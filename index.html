<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flicks in ChatGPT · Concept demo</title>
<style>
:root{
  --bg:#fff; --side:#f9f9f9; --ink:#0d0d0d; --ink2:#5d5d5d; --ink3:#8f8f8f;
  --line:#e5e5e5; --line2:#ededed; --hover:#ececec; --bubble:#e7f1fd;
  --blue:#3b82f6; --green-bg:#dcf5e3; --green:#18794e;
  --font:ui-sans-serif,-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --fw:300px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
svg{flex:none}
.app{display:flex;height:100dvh}

/* ---------- sidebar ---------- */
.side{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line2);display:flex;flex-direction:column;height:100%}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 8px 16px;height:56px}
.side-top b{font-size:18px;font-weight:600;letter-spacing:-.01em}
.side-top .ic{display:flex;gap:2px}
.ibtn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#4a4a4a}
.ibtn:hover{background:var(--hover)}
.nav{padding:4px 6px}
.nav button,.recents button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;line-height:20px}
.nav button:hover,.recents button:hover{background:var(--hover)}
.nav button.on,.recents button.on{background:#ececec}
.grp{font-size:13px;color:var(--ink3);padding:20px 16px 6px}
.empty{font-size:14px;color:#b4b4b4;padding:6px 16px}
.scroll-side{flex:1;overflow-y:auto;padding-bottom:8px}
.recents{padding:0 6px}
.recents button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.me{border-top:1px solid var(--line2);padding:10px 10px 12px}
.me .u{display:flex;align-items:center;gap:10px;padding:6px 6px 10px}
.av{width:28px;height:28px;border-radius:50%;background:#19c37d;color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.me .u b{display:block;font-size:14px;font-weight:500}
.me .u span{font-size:12px;color:var(--ink2)}
.claim{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid #d9d9d9;border-radius:999px;padding:8px;font-size:14px;background:#fff}
.claim:hover{background:#f6f6f6}
.fine{font-size:11px;color:var(--ink3);padding:8px 6px 0;line-height:1.4}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;position:relative;z-index:3;background:var(--bg)}
.top .l{display:flex;align-items:center;gap:6px}
.top .r{display:flex;align-items:center;gap:4px}
.mob,.model.mob{display:none}
.model{display:flex;align-items:center;gap:4px;font-size:17px;font-weight:500;padding:6px 8px;border-radius:8px}
.model:hover{background:var(--hover)}
.offer{display:flex;align-items:center;gap:6px;background:#e7f0fe;color:#1f5fd0;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500}
.share{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:14px}
.share:hover{background:var(--hover)}
.top .home-only,.top .chat-only{display:none;align-items:center;gap:4px}
body:not(.chat) .top .home-only{display:flex}
body.chat .top .chat-only{display:flex}
body.chat .top .home-only{display:none}

.thread{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto}
.col{max-width:720px;margin:0 auto;padding:0 24px}

/* home */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 12vh}
.home h1{font-size:28px;font-weight:400;letter-spacing:-.01em;margin-bottom:26px;text-align:center}
.home .cwrap{width:100%;max-width:680px}
.resume{width:100%;max-width:680px;margin-top:22px;padding:0 6px}
.resume-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:10px}
.qpill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px 10px 12px;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:background .15s,border-color .15s}
.qpill:hover{background:#f7f7f7;border-color:#d6d6d6}
.qpill .hp{width:28px;height:28px;border-radius:50%;background:#f1f1f1;display:grid;place-items:center}
.qpill .go{color:var(--ink3);margin-left:4px}
.qpill.pulse{animation:pulse 2.4s ease-out 1s 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.35)}70%{box-shadow:0 0 0 10px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
.resume-sub{font-size:12px;color:var(--ink3);margin-top:8px;padding-left:4px}
.sugs{width:100%;max-width:680px;margin-top:24px;padding:0 6px}
.sugs button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 10px;border-radius:10px;color:#6b6b6b;font-size:16px}
.sugs button:hover{background:#f7f7f7}

/* composer */
.composer{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e3e3e3;border-radius:28px;padding:8px 8px 8px 10px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.composer input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;padding:8px 4px;background:transparent;color:var(--ink)}
.composer input::placeholder{color:#8a8a8a}
.think{display:flex;align-items:center;gap:6px;color:#6b6b6b;font-size:16px;padding:6px 8px;border-radius:999px}
.think:hover{background:#f3f3f3}
.voice{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.voice.send{background:#0d0d0d}
.foot{flex:none;padding:0 24px 10px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 22px);position:relative;z-index:2}
.foot .col{padding:0}
.disc{font-size:12px;color:var(--ink2);text-align:center;padding:8px 0 0}
body:not(.chat) .foot{display:none}

/* chat */
.msgs{padding:20px 0 40px}
.ub{display:flex;justify-content:flex-end;margin:6px 0 28px}
.ub span{background:var(--bubble);border-radius:20px;padding:10px 18px;font-size:16px;line-height:1.5;max-width:80%}
.ans{font-size:16px;line-height:1.65}
.ans p{margin:0 0 16px}
.ans h3{font-size:18px;font-weight:600;margin:24px 0 8px}
.blk{opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease}
.blk.in{opacity:1;transform:none}
.thinking{font-size:15px;color:var(--ink2);margin:4px 0 18px;background:linear-gradient(90deg,#8f8f8f 30%,#d6d6d6 50%,#8f8f8f 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}

.items{margin:6px 0 18px}
.it{display:grid;grid-template-columns:130px 1fr;gap:10px 18px;padding:16px 0;border-bottom:1px solid var(--line2);align-items:start}
.it:first-child{padding-top:4px}
.it .pic{width:130px;aspect-ratio:130/160;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;display:grid;place-items:center}
.it .pic img{width:100%;height:100%;object-fit:contain}
.it .body{font-size:15px;line-height:1.55;min-width:0}
.badge{display:inline-block;background:var(--green-bg);color:var(--green);font-size:12.5px;font-weight:500;border-radius:6px;padding:1px 7px;margin-bottom:6px}
.tt{display:block;font-weight:600;font-size:16px;text-decoration:none;margin-bottom:4px}
.tt span{border-bottom:1px dashed #9a9a9a}
.it .pr{font-size:13px;color:var(--ink2);margin-top:4px}
.ext{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:15px;text-decoration:none}
.ext span{border-bottom:1px dashed #9a9a9a}
.ext:hover span{border-bottom-color:var(--ink)}

/* Flick product card in the answer */
.it.fl{grid-template-columns:var(--fw) 1fr;align-items:center;gap:14px 22px}
.it.fl .fwrap{width:var(--fw)}
.fhint{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:10px}
.fhint i{width:6px;height:6px;border-radius:50%;background:#19c37d;display:inline-block}

.flick{position:relative;width:100%;aspect-ratio:1/1;background:#f2f2f2;overflow:hidden;border-radius:14px;border:1px solid var(--line)}
.flick iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.fstate{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .4s}
.fstate.load{background:linear-gradient(100deg,#f0f0f0 30%,#fafafa 50%,#f0f0f0 70%);background-size:300% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.fstate.hide{opacity:0}
.fstate.err{background:#fff4f4;pointer-events:auto;padding:16px;text-align:center}
.fstate.err div{color:#c22;font-size:13px;line-height:1.4}
.fstate.err b{display:block;font-size:14px;margin-bottom:4px}
.fwarn{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:3px 7px;pointer-events:none}

.srcs{font-size:16px;margin:4px 0 6px}
.srcs a{text-decoration:none;border-bottom:1px solid #b9b9b9}
.chip{display:inline-flex;align-items:center;gap:5px;background:#f3f3f3;border-radius:999px;padding:2px 8px 2px 4px;font-size:11.5px;color:var(--ink2);margin:0 0 18px}
.chip i{width:14px;height:14px;border-radius:50%;background:#e2483d;display:inline-block}
.acts{display:flex;gap:2px;margin:-4px 0 18px -8px;color:#5d5d5d}
.acts .ibtn{width:32px;height:32px}

/* ad unit */
.adu{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.adu .why{font-size:14px;color:var(--ink2);margin-bottom:10px}
.adh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.adv{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;text-decoration:none}
.adv img{width:22px;height:22px;border-radius:5px}
.adr{display:flex;align-items:center;gap:6px;position:relative}
.adtag{font-size:12px;color:var(--ink2);background:#f1f1f1;border-radius:6px;padding:2px 7px}
.menu{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:6px;width:220px;display:none;z-index:5}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.menu button:hover{background:#f4f4f4}
.carwrap{position:relative;margin-right:-24px}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 24px 8px 0;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.pc{flex:none;width:200px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;scroll-snap-align:start;text-decoration:none;display:flex;flex-direction:column}
.pc .im{height:var(--fw);background:#f3f3f3;display:grid;place-items:center;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:contain}
.pc .tx{padding:10px 12px 12px;font-size:14px;line-height:1.4}
.pc .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;min-height:39px}
.pc .pp{margin-top:6px;font-weight:600}
.pc .pp s{font-weight:400;color:var(--ink3);margin-left:4px}
.pc .rt{font-size:13px;color:var(--ink2);margin-top:2px}
.pc .rt b{color:#f5a623;font-weight:400}
.pc.fc{width:var(--fw)}
.pc.fc .flick{border:0;border-radius:0}
.next{position:absolute;right:30px;top:calc(var(--fw) / 2 - 18px);width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.1);display:grid;place-items:center}
.endnote{font-size:11.5px;color:var(--ink3);text-align:center;margin:36px 0 10px}

.down{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08);display:none;place-items:center;z-index:4}
.down.on{display:grid}

.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,10px);background:#0d0d0d;color:#fff;font-size:14px;border-radius:10px;padding:10px 14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto}
.scrim{display:none}


/* ---------- more ad formats ---------- */
.ans ul{margin:0 0 16px 22px}
.ans li{margin:5px 0}
img.lg.fav{object-fit:contain;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.lg{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;letter-spacing:.02em}
.shop{height:36px;padding:0 16px;border-radius:999px;background:#0d0d0d;color:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.shop:hover{background:#2b2b2b}
.shop:disabled{background:#e9e9e9;color:#6b6b6b;cursor:default}
.dom{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);text-decoration:none}
.spa{display:grid;grid-template-columns:var(--fw) 1fr;align-items:center;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.spa .flick,.sc .flick,.wide .flick{border:0;border-radius:0}
.spa-t{padding:16px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.spa-t .nm{font-size:17px;font-weight:600;line-height:1.35}
.spa-t p{font-size:14px;color:var(--ink2);line-height:1.5;margin:0}
.sc{display:grid;grid-template-columns:240px 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.sc-t{padding:14px 18px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.sc-t .nm{font-size:16px;font-weight:600;text-decoration:none}
.sc-t .nm:hover{text-decoration:underline}
.sc-t p{font-size:14px;color:var(--ink2);line-height:1.5;margin:0}
.agc{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff}
.agc-t b{display:block;font-size:15px;font-weight:600}
.agc-t span{font-size:14px;color:var(--ink2)}
.agent{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;background:#fafafa}
.agh{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px}
.agh b{font-weight:600}
.ub.sm{margin:4px 0 12px}
.ub.sm span{font-size:15px;padding:8px 14px}
.agm{font-size:15px;line-height:1.55;margin:0 0 12px}
.agf{width:var(--fw);max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px}
.chips button:hover{background:#f3f3f3}
.gen{position:relative;width:min(100%,420px);aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#ececec;margin:0 0 18px}
.gen .art{position:absolute;inset:0;filter:blur(26px) saturate(.6);opacity:.55;transform:scale(1.12);transition:filter 1.2s ease,opacity 1.2s ease,transform 1.2s ease}
.gen .art img{width:100%;height:100%;object-fit:cover;display:block}
.gen.done .art{filter:none;opacity:1;transform:none}
.gen .gl{position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:8px;font-size:14px;color:#3d3d3d;background:rgba(255,255,255,.75);border-radius:999px;padding:5px 12px 5px 8px;transition:opacity .4s}
.gen.done .gl{opacity:0}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #b9b9b9;border-top-color:#3d3d3d;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gad{border-top:0;padding-top:0}
.wide{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;max-width:520px}
.flick.r43{aspect-ratio:4/3}
.wide-t{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.wide-t b{display:block;font-size:15px;font-weight:600}
.wide-t span{font-size:13.5px;color:var(--ink2)}
[data-anchor]{border-radius:16px}
.flash{animation:hl 2.2s ease-out 1}
@keyframes hl{0%{box-shadow:0 0 0 0 #f5c518}15%{box-shadow:0 0 0 4px #f5c518}100%{box-shadow:0 0 0 4px transparent}}

/* ---------- ad selector ---------- */
.gpill{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:#1b1b1b;color:#f2f2f2;font-weight:600;font-size:13px;box-shadow:0 0 0 1px #3a3a3a,0 8px 24px rgba(0,0,0,.35)}
.gpill:hover{background:#2a2a2a}
.gpill i{font-style:normal;background:var(--blue);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.gscrim{position:fixed;inset:0;z-index:38;display:none}
.gscrim.on{display:block}
.gpanel{position:fixed;right:20px;bottom:70px;z-index:39;width:330px;max-height:min(70vh,560px);overflow-y:auto;background:#1b1b1b;color:#f2f2f2;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.4);padding:6px 6px 8px;display:none}
.gpanel.on{display:block}
.gpanel h6{margin:10px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9a9a9a}
.gitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:38px;padding:6px 10px;border-radius:8px;font-size:13px;line-height:1.3;color:#f2f2f2}
.gitem:hover{background:#2c2c2c}
.gitem.cur{background:#1f3350}
.gitem .n{width:18px;flex:none;color:#9a9a9a;font-size:12px;font-variant-numeric:tabular-nums}
.gitem .b{margin-left:auto;font-size:11px;color:#9a9a9a;flex:none;padding-left:8px}
@media (min-width:768px) and (max-width:1279px){ body.chat .gpill{bottom:104px} body.chat .gpanel{bottom:154px} }

/* ---------- mobile ---------- */
@media (max-width:767px){
  :root{--fw:min(300px, calc(100vw - 96px))}
  .side{position:fixed;inset:0 auto 0 0;z-index:20;width:84vw;max-width:300px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:none}
  body.drawer .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:15}
  body.drawer .scrim{display:block}
  .mob{display:grid}
  .model.mob{display:flex}
  .top{padding:0 6px;height:52px}
  .top .home-only .offer{padding:6px 10px;font-size:13px}
  .share .lbl{display:none}
  .col{padding:0 16px}
  .home{justify-content:center;padding:0 20px 20px}
  .home h1{font-size:24px;margin-bottom:18px}
  .home .cwrap,.sugs{display:none}
  body:not(.chat) .foot{display:block}
  .resume{margin-top:0;text-align:center}
  .resume-h{justify-content:center}
  .foot{padding:0 12px calc(8px + env(safe-area-inset-bottom))}
  .think .lbl{display:none}
  .disc{display:none}
  .it.fl{grid-template-columns:1fr}
  .it.fl .fwrap{width:100%}
  .it{grid-template-columns:96px 1fr;gap:8px 14px}
  .it .pic{width:96px}
  .carwrap{margin-right:-16px}
  .car{padding-right:16px}
  .pc{width:160px}
  .next{display:none}
  .down{bottom:84px}
}
@media (max-width:767px){
  .spa,.sc{grid-template-columns:1fr}
  .spa-t,.sc-t{padding:14px 16px}
  .agc{flex-direction:column;align-items:flex-start}
  .gpill{right:12px;bottom:84px;height:36px;padding:0 12px}
  .gpanel{right:12px;left:12px;width:auto;bottom:128px}
  body.drawer .gpill{display:none}
}
@media (max-width:767px) and (min-width:480px){ :root{--fw:300px} }
</style>
</head>

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){ const el=$("#toast"); el.classList.remove("act"); el.textContent=t; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),2400); }
function drawer(on){ document.body.classList.toggle("drawer", on); if(on) toggleGuide(false); }
// Open the advertiser in a new tab. If the browser blocks it, offer a one-tap link instead.
function openOut(url, label){
  const w=window.open(url, "_blank");
  if(w){ try{ w.opener=null; }catch(e){} toast("Opening " + label); return; }
  const el=$("#toast"); el.innerHTML=`<a href="${url}" target="_blank" rel="noopener" style="color:#fff;text-decoration:underline">Continue to ${esc(label)} ↗</a>`;
  el.classList.add("on","act"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on","act"),6000);
}

/* ---------------- Flick slots ---------------- */
let SLOTS = {};
const inZone = (z,m) => z && m.x>=z.x0 && m.x<=z.x1 && m.y>=z.y0 && m.y<=z.y1;
function flickHost(slotId, brand, cls=""){
  SLOTS[slotId] = { brand, ready:false, lastCta:0 };
  return `<div class="flick ${cls}" data-slot="${slotId}"><div class="fstate load"></div></div>`;
}
function tagDoc(slotId, b){
  // Bridge runs before the tag: routes the creative's CTA and render status to this page.

function mountFlicks(root=document){
  root.querySelectorAll(".flick[data-slot]").forEach(host=>{
    if(host.querySelector("iframe")) return;
    const id=host.dataset.slot, s=SLOTS[id]; if(!s) return;
    const b=BRANDS[s.brand];
    const f=document.createElement("iframe");
    f.title=`${b.name} Flick: interactive video`; f.setAttribute("allow","autoplay; fullscreen"); f.setAttribute("scrolling","no");
    f.srcdoc=tagDoc(id, b);
    host.prepend(f);
    // No ready signal after 10s: lift the loader so a playing Flick is never hidden, and flag it.
    s.timer=setTimeout(()=>{ if(s.ready||s.error) return; host.querySelector(".fstate")?.classList.add("hide");
      if(!host.querySelector(".fwarn")) host.insertAdjacentHTML("beforeend",`<span class="fwarn">No ready signal from Flick yet</span>`);
      console.warn("[flicks] no vertex-ready from", id, b.src); },10000);
  });
}
function clearSlots(){ Object.values(SLOTS).forEach(s=>clearTimeout(s.timer)); SLOTS={}; }
function fire(s,url){
  const now=Date.now(); if(now-s.lastCta<900) return; s.lastCta=now;
  const b=BRANDS[s.brand]; openOut((b.own && url) ? url : b.url, b.name);
}
window.addEventListener("message", e=>{
  const m=e.data; if(!m||m.flam!==1) return;
  const s=SLOTS[m.slot]; if(!s) return;
  const host=document.querySelector(`.flick[data-slot="${m.slot}"]`);
  if(!host || e.source!==host.querySelector("iframe")?.contentWindow) return;
  if(m.type==="ready"){ s.ready=true; clearTimeout(s.timer); host.querySelector(".fstate")?.classList.add("hide"); host.querySelector(".fwarn")?.remove(); }
  else if(m.type==="error"){ s.error=true; clearTimeout(s.timer); console.error("[flicks] render error", m.slot, m.msg);
    const st=host.querySelector(".fstate"); st.className="fstate err";
    st.innerHTML=`<div><b>Flick failed to load</b>${esc(m.msg)}<br><br>If this file is open inside a preview window, open the hosted link in Chrome instead. Previews block ad scripts.</div>`; }
  else if(m.type==="cta" || (m.type==="tap" && inZone(BRANDS[s.brand].zone,m))){ fire(s,m.url); }
});

function setRecent(title, key){

  let rb=document.querySelector(`#recents button[data-k="${key}"]`);

function openChat(key, opt={}){
  const c=CHATS[key]; if(!c) return;
  const my=++run; cur=key; done=false;
  document.body.classList.add("chat"); drawer(false);
  $("#home").hidden=true; msgs.hidden=false;
  clearSlots();
  msgs.innerHTML=`<div class="ub"><span>${esc(c.q)}</span></div><div class="ans" id="ans"></div><p class="endnote">Concept demo by Flam. Not affiliated with or endorsed by OpenAI or the brands shown.</p>`;
  setRecent(c.title, key); markGuide();
  thread.scrollTop=0;
  const ans=$("#ans"), blocks=c.blocks();
  const add=h=>{ const d=document.createElement("div"); d.className="blk"; d.innerHTML=h; ans.appendChild(d); mountFlicks(d); setTimeout(()=>d.classList.add("in"),20); };
  const finish=()=>{ done=true; c.after && c.after(my, !!opt.instant); updDown(); if(opt.anchor) focusAnchor(opt.anchor); };
  if(opt.instant){ blocks.forEach(add); finish(); return; }
  if(c.think) ans.innerHTML=`<p class="thinking">${c.think}</p>`;
  setTimeout(()=>{
    if(my!==run) return; ans.innerHTML="";
    blocks.forEach((h,i)=>setTimeout(()=>{ if(my!==run) return; add(h); updDown(); if(i===blocks.length-1) finish(); }, i*220));
  }, c.think ? 1100 : 250);
}

  openChat("_other");
}

}
function focusAnchor(a){
  setTimeout(()=>{
    let el=msgs.querySelector(`[data-anchor="${a}"]`); if(!el) return;
    if(a==="ad-cad"){ openAgent(); el=msgs.querySelector(`[data-anchor="agent-cad"]`) || el; }
    const tall = el.offsetHeight > thread.clientHeight - 40;
    // Image generation: keep the "Creating image" state in view above the ad.
    el.scrollIntoView({behavior:"smooth", block: a==="ad-airbnb" && !tall ? "end" : (tall ? "start" : "center")});
    document.querySelectorAll(".flash").forEach(x=>x.classList.remove("flash")); void el.offsetWidth; el.classList.add("flash");
  }, 300);
}
renderGuide();

/* ---------------- scroll-to-bottom button ---------------- */
const down=$("#down");
function updDown(){ const gap=thread.scrollHeight-thread.clientHeight-thread.scrollTop; down.classList.toggle("on", document.body.classList.contains("chat") && gap>120); }
thread.addEventListener("scroll",updDown,{passive:true}); addEventListener("resize",updDown);
down.onclick=()=>thread.scrollTo({top:thread.scrollHeight,behavior:"smooth"});

</script>
</body>
